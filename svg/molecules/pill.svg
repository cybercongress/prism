<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
  <rect width="640" height="260" fill="#000"/>

  <!-- pill: auto×fix(3g)=24px. corner-radius 3g/2=12. -->

  <!-- ═══ ROW 1: COLOR VARIANTS ═══ -->
  <text x="320" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">tag variants</text>

  <!-- 6 pills + on/off = 8 items. each ~72px, gap=16. total=8×72+7×16=688 tight. Use smaller pills ~56px, gap=12 -->
  <!-- green, red, blue, white, gray, avatar, on, off -->

  <!-- green -->
  <g transform="translate(16, 40)">
    <rect x="0" y="0" width="72" height="24" rx="12" fill="#00fe00" opacity="0.15"/>
    <rect x="0" y="0" width="72" height="24" rx="12" fill="none" stroke="#00fe00" stroke-width="0.5" opacity="0.3"/>
    <text x="36" y="16" font-family="Play, sans-serif" font-size="12" fill="#00fe00" text-anchor="middle">verified</text>
    <text x="36" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">green</text>
  </g>

  <!-- red -->
  <g transform="translate(104, 40)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#ff0000" opacity="0.15"/>
    <rect x="0" y="0" width="56" height="24" rx="12" fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
    <text x="28" y="16" font-family="Play, sans-serif" font-size="12" fill="#ff0000" text-anchor="middle">spam</text>
    <text x="28" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">red</text>
  </g>

  <!-- blue -->
  <g transform="translate(176, 40)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#00acff" opacity="0.15"/>
    <rect x="0" y="0" width="56" height="24" rx="12" fill="none" stroke="#00acff" stroke-width="0.5" opacity="0.3"/>
    <text x="28" y="16" font-family="Play, sans-serif" font-size="12" fill="#00acff" text-anchor="middle">cyber</text>
    <text x="28" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">blue</text>
  </g>

  <!-- white -->
  <g transform="translate(248, 40)">
    <rect x="0" y="0" width="64" height="24" rx="12" fill="#fff" opacity="0.08"/>
    <rect x="0" y="0" width="64" height="24" rx="12" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.15"/>
    <text x="32" y="16" font-family="Play, sans-serif" font-size="12" fill="#fff" text-anchor="middle">text 1.3k</text>
    <text x="32" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">white</text>
  </g>

  <!-- gray -->
  <g transform="translate(328, 40)">
    <rect x="0" y="0" width="72" height="24" rx="12" fill="#4b4b4d" opacity="0.2"/>
    <rect x="0" y="0" width="72" height="24" rx="12" fill="none" stroke="#4b4b4d" stroke-width="0.5"/>
    <text x="36" y="16" font-family="Play, sans-serif" font-size="12" fill="#4b4b4d" text-anchor="middle">archived</text>
    <text x="36" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">gray</text>
  </g>

  <!-- on (toggled) -->
  <g transform="translate(416, 40)">
    <rect x="0" y="0" width="48" height="24" rx="12" fill="#00fe00" opacity="0.2"/>
    <rect x="0" y="0" width="48" height="24" rx="12" fill="none" stroke="#00fe00" stroke-width="0.5" opacity="0.4"/>
    <text x="24" y="16" font-family="Play, sans-serif" font-size="12" fill="#00fe00" text-anchor="middle">text</text>
    <text x="24" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">on</text>
  </g>

  <!-- off -->
  <g transform="translate(480, 40)">
    <rect x="0" y="0" width="48" height="24" rx="12" fill="#333" opacity="0.15"/>
    <rect x="0" y="0" width="48" height="24" rx="12" fill="none" stroke="#4b4b4d" stroke-width="0.5"/>
    <text x="24" y="16" font-family="Play, sans-serif" font-size="12" fill="#4b4b4d" text-anchor="middle">text</text>
    <text x="24" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">off</text>
  </g>

  <!-- avatar pill -->
  <g transform="translate(544, 40)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#fff" opacity="0.05"/>
    <rect x="0" y="0" width="80" height="24" rx="12" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.1"/>
    <circle cx="14" cy="12" r="8" fill="#2a4a3a"/>
    <text x="48" y="16" font-family="Play, sans-serif" font-size="12" fill="#d7d7d7" text-anchor="middle">cybergirl</text>
    <text x="40" y="44" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">avatar</text>
  </g>

  <!-- ═══ ROW 2: PROGRESS MODE ═══ -->
  <rect x="40" y="100" width="560" height="1" fill="#1a1a1a"/>
  <text x="320" y="124" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">progress mode (replaces indicator)</text>

  <!-- 4 progress pills at different fill levels -->
  <!-- each W=120, gap=24. total=4×120+3×24=552. offset=(640-552)/2=44 -->

  <!-- 92% green -->
  <g transform="translate(44, 140)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#333" opacity="0.15"/>
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#00fe00" opacity="0.2"/>
    <text x="60" y="44" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">92%</text>
  </g>

  <!-- 65% green -->
  <g transform="translate(188, 140)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#333" opacity="0.15"/>
    <rect x="0" y="0" width="78" height="24" rx="12" fill="#00fe00" opacity="0.15"/>
    <text x="60" y="44" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">65%</text>
  </g>

  <!-- 30% yellow -->
  <g transform="translate(332, 140)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#333" opacity="0.15"/>
    <rect x="0" y="0" width="36" height="24" rx="12" fill="#fcf000" opacity="0.15"/>
    <text x="60" y="44" font-family="Play, sans-serif" font-size="10" fill="#fcf000" text-anchor="middle">30%</text>
  </g>

  <!-- 10% red -->
  <g transform="translate(476, 140)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#333" opacity="0.15"/>
    <rect x="0" y="0" width="12" height="24" rx="12" fill="#ff0000" opacity="0.15"/>
    <text x="60" y="44" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">10%</text>
  </g>

  <!-- ═══ ROW 3: STATES ═══ -->
  <rect x="40" y="200" width="560" height="1" fill="#1a1a1a"/>
  <text x="320" y="224" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states: hover · active</text>

  <!-- hover: brighter -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="72" height="24" rx="12" fill="#00fe00" opacity="0.25"/>
    <rect x="0" y="0" width="72" height="24" rx="12" fill="none" stroke="#00fe00" stroke-width="1" opacity="0.5"/>
    <text x="36" y="16" font-family="Play, sans-serif" font-size="12" fill="#00fe00" text-anchor="middle">verified</text>
  </g>
  <text x="216" y="52" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle" transform="translate(0, 208)">hover</text>

  <!-- active: scale 0.95 -->
  <g transform="translate(340, 241)">
    <rect x="1" y="1" width="70" height="22" rx="11" fill="#00fe00" opacity="0.2"/>
    <rect x="1" y="1" width="70" height="22" rx="11" fill="none" stroke="#00fe00" stroke-width="0.5" opacity="0.4"/>
    <text x="36" y="15" font-family="Play, sans-serif" font-size="12" fill="#00fe00" text-anchor="middle">verified</text>
  </g>
  <text x="376" y="52" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle" transform="translate(0, 208)">active (0.95×)</text>

</svg>
