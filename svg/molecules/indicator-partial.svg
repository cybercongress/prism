<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76">
  <!-- 0-atoms/indicator/partial — circular progress, based on Sketch progress-bar halo -->
  <!-- prysm atom, acid palette -->
  <g id="indicator-partial">
    <circle id="track" cx="38" cy="38" r="36" fill="none" stroke="#4b4b4d" stroke-width="2"/>
    <circle id="fill" cx="38" cy="38" r="36" fill="none" stroke="#00fe00" stroke-width="2"
      stroke-dasharray="226.2" stroke-dashoffset="90.5" stroke-linecap="round"
      transform="rotate(-90 38 38)"/>
    <circle id="inner-bg" cx="38" cy="38" r="18" fill="#000000"/>
    <text id="value" x="38" y="43" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">60%</text>
  </g>
</svg>
