<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <filter id="gg" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="200" fill="#000"/>

  <!-- ═══ ROW 1: EMOTION + INDICATOR ═══ -->
  <text x="320" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">emotion by change direction</text>

  <!-- growth green +12% -->
  <g transform="translate(36, 40)">
    <text x="44" y="22" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124 736</text>
    <rect x="4" y="28" width="80" height="1" fill="#333"/>
    <rect x="4" y="28" width="10" height="1" fill="#00fe00" filter="url(#gg)"/>
    <text x="44" y="46" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">growth +12%</text>
  </g>

  <!-- decline red -8% -->
  <g transform="translate(156, 40)">
    <text x="44" y="22" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">18 042</text>
    <rect x="8" y="28" width="72" height="1" fill="#333"/>
    <rect x="8" y="28" width="6" height="1" fill="#ff0000" filter="url(#gr)"/>
    <text x="44" y="46" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">drop -8%</text>
  </g>

  <!-- stable white 0% -->
  <g transform="translate(276, 40)">
    <text x="44" y="22" font-family="Play, sans-serif" font-size="20" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5 040</text>
    <rect x="12" y="28" width="64" height="1" fill="#333"/>
    <text x="44" y="46" font-family="Play, sans-serif" font-size="10" fill="#777" text-anchor="middle">stable 0%</text>
  </g>

  <!-- fold l2 abbreviated -->
  <g transform="translate(396, 40)">
    <text x="32" y="22" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124k</text>
    <text x="32" y="46" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- fold l2 large -->
  <g transform="translate(500, 40)">
    <text x="32" y="22" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">3.4M</text>
    <text x="32" y="46" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- ═══ ROW 2: COUNTER WITH SYMBOL / LABEL ═══ -->
  <rect x="40" y="100" width="560" height="1" fill="#1a1a1a"/>
  <text x="320" y="124" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">counter with symbol</text>

  <!-- uniform gap = 48px between items. 4 items centered. -->
  <!-- item widths: ~120, ~60, ~110, ~70 = 360. gaps: 3×48=144. total=504. offset=(640-504)/2=68 -->

  <!-- 18 800 🟢BOOT -->
  <g transform="translate(68, 140)">
    <text x="0" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" style="font-variant-numeric:tabular-nums">18 800</text>
    <text x="62" y="18" font-family="Play, sans-serif" font-size="14" fill="#00fe00">🟢</text>
    <text x="80" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff">BOOT</text>
    <text x="56" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">counter + symbol</text>
  </g>

  <!-- ⚡ 42 V -->
  <g transform="translate(236, 140)">
    <text x="0" y="18" font-family="Play, sans-serif" font-size="14" fill="#fcf000">⚡</text>
    <text x="20" y="18" font-family="Play, sans-serif" font-size="16" fill="#fcf000" style="font-variant-numeric:tabular-nums">42</text>
    <text x="44" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff">V</text>
    <text x="28" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">counter + label</text>
  </g>

  <!-- 2 726 particles -->
  <g transform="translate(344, 140)">
    <text x="0" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" style="font-variant-numeric:tabular-nums">2 726</text>
    <text x="52" y="18" font-family="Play, sans-serif" font-size="14" fill="#777">particles</text>
    <text x="52" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">counter + text</text>
  </g>

  <!-- 15.43% -->
  <g transform="translate(500, 140)">
    <text x="0" y="18" font-family="Play, sans-serif" font-size="16" fill="#00fe00" style="font-variant-numeric:tabular-nums">15.43%</text>
    <text x="28" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">percentage</text>
  </g>

</svg>
