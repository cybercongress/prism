<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <filter id="gg" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="220" fill="#000"/>

  <!-- counter: number + change indicator bar -->
  <!-- bar = full width of number text = 100%. colored portion = % change. rest = gray track -->

  <!-- ═══ ROW 1: EMOTION BY CHANGE ═══ -->
  <text x="320" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">emotion by change direction</text>

  <!-- growth (green, +12% change) — text ~80px wide -->
  <g transform="translate(36, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124 736</text>
    <!-- gray track full width -->
    <rect x="4" y="30" width="80" height="1" fill="#333"/>
    <!-- green fill = 12% of 80 = 10px -->
    <rect x="4" y="30" width="10" height="1" fill="#00fe00" filter="url(#gg)"/>
    <text x="44" y="52" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">growth +12%</text>
  </g>

  <!-- decline (red, -8% change) — text ~72px wide -->
  <g transform="translate(156, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">18 042</text>
    <rect x="8" y="30" width="72" height="1" fill="#333"/>
    <!-- red fill = 8% of 72 = 6px -->
    <rect x="8" y="30" width="6" height="1" fill="#ff0000" filter="url(#gr)"/>
    <text x="44" y="52" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">decline -8%</text>
  </g>

  <!-- stable (white, 0% change) — no colored fill, just gray track -->
  <g transform="translate(276, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5 040</text>
    <rect x="12" y="30" width="64" height="1" fill="#333"/>
    <text x="44" y="52" font-family="Play, sans-serif" font-size="10" fill="#777" text-anchor="middle">stable 0%</text>
  </g>

  <!-- fold l2: abbreviated -->
  <g transform="translate(396, 44)">
    <text x="32" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124k</text>
    <text x="32" y="52" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- fold l2: large -->
  <g transform="translate(500, 44)">
    <text x="32" y="24" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">3.4M</text>
    <text x="32" y="52" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- ═══ ROW 2: STATES + SIZES ═══ -->
  <rect x="40" y="112" width="560" height="1" fill="#1a1a1a"/>
  <text x="320" y="136" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states and sizes</text>

  <!-- loading: white skeleton, NO indicator bar -->
  <g transform="translate(60, 152)">
    <rect x="4" y="4" width="72" height="16" rx="3" fill="#fff" opacity="0.3"/>
    <text x="40" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>
  </g>

  <!-- large counter with indicator (+50%) -->
  <g transform="translate(190, 148)">
    <text x="56" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">1 346 504</text>
    <rect x="4" y="30" width="104" height="1" fill="#333"/>
    <rect x="4" y="30" width="52" height="1" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="48" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">+50%</text>
  </g>

  <!-- inline counter (no change, no indicator) -->
  <g transform="translate(360, 152)">
    <text x="32" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2 726</text>
    <text x="32" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">inline</text>
  </g>

  <!-- counter + label (as used in filter bar) -->
  <g transform="translate(460, 152)">
    <text x="32" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2 726</text>
    <text x="76" y="18" font-family="Play, sans-serif" font-size="14" fill="#777">particles</text>
    <text x="56" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">counter + label</text>
  </g>

</svg>
