<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <filter id="gg" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.4" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gw" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="220" fill="#000"/>

  <!-- counter: text(number) + small saber dot (change indicator) -->
  <!-- saber indicator = short line showing magnitude of change, NOT underline -->

  <!-- ═══ ROW 1: EMOTION BY CHANGE ═══ -->
  <text x="320" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">emotion by change direction</text>

  <!-- 5 items, gap=32. each ~88px wide. total=5×88+4×32=568. offset=(640-568)/2=36 -->

  <!-- growth (green) -->
  <g transform="translate(36, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124 736</text>
    <rect x="30" y="30" width="28" height="1" fill="#00fe00" filter="url(#gg)"/>
    <text x="44" y="56" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">growth</text>
  </g>

  <!-- decline (red) -->
  <g transform="translate(156, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">18 042</text>
    <rect x="30" y="30" width="28" height="1" fill="#ff0000" filter="url(#gr)"/>
    <text x="44" y="56" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">decline</text>
  </g>

  <!-- stable (white) — no indicator -->
  <g transform="translate(276, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5 040</text>
    <text x="44" y="56" font-family="Play, sans-serif" font-size="10" fill="#777" text-anchor="middle">stable</text>
  </g>

  <!-- fold l2: abbreviated -->
  <g transform="translate(396, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">124k</text>
    <text x="44" y="56" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- fold l2: large -->
  <g transform="translate(516, 44)">
    <text x="44" y="24" font-family="Play, sans-serif" font-size="20" fill="#ff0000" text-anchor="middle" style="font-variant-numeric:tabular-nums">3.4M</text>
    <text x="44" y="56" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">fold l2</text>
  </g>

  <!-- ═══ ROW 2: STATES + SIZES ═══ -->
  <rect x="40" y="112" width="560" height="1" fill="#1a1a1a"/>
  <text x="320" y="136" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states and sizes</text>

  <!-- 4 items, gap=40. each ~100px. total=4×100+3×40=520. offset=(640-520)/2=60 -->

  <!-- loading skeleton -->
  <g transform="translate(60, 152)">
    <rect x="10" y="6" width="60" height="14" rx="2" fill="#222"/>
    <text x="40" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>
  </g>

  <!-- h3 size -->
  <g transform="translate(200, 148)">
    <text x="50" y="24" font-family="Play, sans-serif" font-size="20" fill="#00fe00" text-anchor="middle" style="font-variant-numeric:tabular-nums">1 346 504</text>
    <rect x="30" y="30" width="40" height="1" fill="#00fe00" filter="url(#gg)"/>
    <text x="50" y="48" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">h3</text>
  </g>

  <!-- body size -->
  <g transform="translate(340, 152)">
    <text x="40" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2 726</text>
    <text x="40" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">body</text>
  </g>

  <!-- with label -->
  <g transform="translate(460, 152)">
    <text x="40" y="18" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2 726</text>
    <text x="80" y="18" font-family="Play, sans-serif" font-size="14" fill="#777">particles</text>
    <text x="60" y="40" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">with label</text>
  </g>

</svg>
