<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560">
  <defs>
    <filter id="gw" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gy" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fcf000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="iwr"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="iwl" x1="1" x2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="igr"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="igl" x1="1" x2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="irr"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="irl" x1="1" x2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyr"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyl" x1="1" x2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="600" height="560" fill="#000"/>

  <!-- ═══ BUTTON ANATOMY ═══ -->
  <!-- saber(2) + glow(20) + pad(16) + TEXT + pad(16) + glow(20) + saber(2) -->
  <!-- pad = 2g = 16px from glow edge to text start -->
  <!-- text at x = 2 + 20 + 16 + textWidth/2 = 38 + textWidth/2 -->
  <!-- right saber at x = 38 + textWidth + 16 + 20 = 74 + textWidth -->
  <!-- Play 16px: ~9px per char average -->

  <!-- Cancel: 6ch×9=54, W=54+76=130, center text at 38+27=65, right saber at 128 -->
  <!-- Close:  5ch×9=45, W=45+76=121, center text at 38+22=60, right saber at 119 -->
  <!-- Back:   4ch×9=36, W=36+76=112, center text at 38+18=56, right saber at 110 -->
  <!-- Sign:   4ch×9=36, W=112 -->
  <!-- Stake:  5ch×9=45, W=121 -->
  <!-- Claim:  5ch×9=45, W=121 -->
  <!-- Send:   4ch×9=36, W=112 -->
  <!-- Delegate: 8ch×9=72, W=148 -->

  <!-- ═══ ROW 1: NEUTRAL ═══ -->
  <text x="300" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">neutral</text>

  <!-- Cancel W=130, Close W=121, Back W=112. total=363+2×24=411. offset=(600-411)/2=94 -->
  <g transform="translate(94, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="65" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Cancel</text>
    <rect x="108" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="128" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <g transform="translate(248, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Close</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="118" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <g transform="translate(393, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Back</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="110" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>

  <!-- ═══ ROW 2: CONFIRM ═══ -->
  <rect x="40" y="104" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="128" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">confirm</text>

  <!-- Sign W=112, Stake W=121, Claim W=121, Send W=112, Delegate W=148. total=614+4×8=646 too wide -->
  <!-- use gap=8. total=614+32=646. offset=(600-646)/2=-23. Shrink: use gap=4 → 614+16=630, offset=-15. Still tight. -->
  <!-- Stack tighter: gap=6 -->
  <!-- Just position them manually for clean fit -->
  <g transform="translate(6, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#igl)"/><rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(120, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Stake</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#igl)"/><rect x="118" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(246, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Claim</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#igl)"/><rect x="118" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(372, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Send</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#igl)"/><rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(490, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="52" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Delegate</text>
    <rect x="82" y="0" width="20" height="48" fill="url(#igl)"/><rect x="102" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>

  <!-- ═══ ROW 3: DANGER ═══ -->
  <rect x="40" y="208" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="232" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">danger</text>

  <!-- Delete key: ~10ch=90, W=166. Burn: ~6ch(with emoji)=54, W=130. total=296+32=328. offset=136 -->
  <g transform="translate(136, 248)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="83" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">🗑 Delete key</text>
    <rect x="144" y="0" width="20" height="48" fill="url(#irl)"/><rect x="164" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>
  <g transform="translate(332, 248)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="65" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">🔥 Burn</text>
    <rect x="108" y="0" width="20" height="48" fill="url(#irl)"/><rect x="128" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 4: CAUTION ═══ -->
  <rect x="40" y="312" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="336" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">caution</text>

  <!-- Transfer: 8ch=72, W=148. offset=(600-148)/2=226 -->
  <g transform="translate(226, 352)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iyr)"/><rect x="0" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
    <text x="74" y="30" font-family="Play, sans-serif" font-size="16" fill="#fcf000" text-anchor="middle">Transfer</text>
    <rect x="126" y="0" width="20" height="48" fill="url(#iyl)"/><rect x="146" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
  </g>

  <!-- ═══ ROW 5: STATES ═══ -->
  <rect x="40" y="416" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="440" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states</text>

  <!-- all Sign W=112, gap=48, total=336+96=432, offset=(600-432)/2=84 -->
  <!-- disabled -->
  <g transform="translate(84, 456)">
    <rect x="0" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#4b4b4d" text-anchor="middle">Sign</text>
    <rect x="110" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="56" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">disabled</text>
  </g>

  <!-- hover: wider glow -->
  <g transform="translate(244, 456)">
    <rect x="-2" y="0" width="24" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="90" y="0" width="24" height="48" fill="url(#igl)"/><rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">hover</text>
  </g>

  <!-- loading: dim -->
  <g transform="translate(404, 456)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" opacity="0.5" text-anchor="middle">Sign</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#igl)"/><rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="56" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>
  </g>

</svg>
