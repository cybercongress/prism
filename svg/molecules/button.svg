<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540">
  <defs>
    <filter id="gw" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gy" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fcf000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="iwr"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="iwl" x1="1" x2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="igr"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="igl" x1="1" x2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="irr"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="irl" x1="1" x2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyr"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyl" x1="1" x2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="560" height="540" fill="#000"/>

  <!-- ═══ ROW 1: EMOTION VARIANTS ═══ -->
  <text x="280" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">emotion variants</text>

  <!-- 4 buttons, each 120px wide, total 480+gaps. Center: start at x=20, spacing 140 -->
  <!-- neutral -->
  <g transform="translate(20, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="55" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Navigate</text>
    <rect x="88" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="108" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <text x="75" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">neutral</text>

  <!-- confirm -->
  <g transform="translate(150, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="55" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Confirm</text>
    <rect x="88" y="0" width="20" height="48" fill="url(#igl)"/><rect x="108" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="205" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">confirm</text>

  <!-- danger -->
  <g transform="translate(290, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Delete</text>
    <rect x="76" y="0" width="20" height="48" fill="url(#irl)"/><rect x="96" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>
  <text x="340" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">danger</text>

  <!-- caution -->
  <g transform="translate(420, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iyr)"/><rect x="0" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
    <text x="55" y="30" font-family="Play, sans-serif" font-size="16" fill="#fcf000" text-anchor="middle">Transfer</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#iyl)"/><rect x="110" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
  </g>
  <text x="476" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">caution</text>

  <!-- ═══ ROW 2: STATES ═══ -->
  <rect x="24" y="124" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="148" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states</text>

  <!-- disabled -->
  <g transform="translate(50, 164)">
    <rect x="0" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="50" y="30" font-family="Play, sans-serif" font-size="16" fill="#4b4b4d" text-anchor="middle">Disabled</text>
    <rect x="98" y="0" width="2" height="48" fill="#4b4b4d"/>
  </g>
  <text x="100" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">disabled</text>

  <!-- hover -->
  <g transform="translate(210, 164)">
    <rect x="2" y="0" width="28" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="58" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Hover</text>
    <rect x="86" y="0" width="28" height="48" fill="url(#igl)"/><rect x="114" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="268" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">hover (glow 4g)</text>

  <!-- loading -->
  <g transform="translate(380, 164)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" opacity="0.5" text-anchor="middle">Signing...</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#igl)"/><rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
  </g>
  <text x="438" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>

  <!-- ═══ ROW 3: DOUBLE ═══ -->
  <rect x="24" y="244" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="268" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">double (shared saber between actions)</text>

  <!-- double: saber | Stake | saber(shared) | Unstake | saber -->
  <!-- centered: total ~240px, start at x=160 -->
  <g transform="translate(160, 284)">
    <!-- left saber (green) -->
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <!-- Stake label -->
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Stake</text>
    <!-- shared middle saber: left glow green, right glow red -->
    <rect x="98" y="0" width="12" height="48" fill="url(#igl)"/>
    <rect x="110" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <rect x="112" y="0" width="12" height="48" fill="url(#irr)"/>
    <!-- Unstake label -->
    <text x="170" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Unstake</text>
    <!-- right saber (red) -->
    <rect x="208" y="0" width="20" height="48" fill="url(#irl)"/><rect x="228" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 4: TRIPLE ═══ -->
  <rect x="24" y="348" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="372" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">triple (shared sabers, destructive rightmost)</text>

  <!-- triple: saber | Cancel | saber(shared) | Restake | saber(shared) | Unstake | saber -->
  <!-- centered: total ~360px, start at x=100 -->
  <g transform="translate(100, 388)">
    <!-- left saber (white) -->
    <rect x="2" y="0" width="16" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <!-- Cancel -->
    <text x="52" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Cancel</text>
    <!-- shared saber white→green -->
    <rect x="84" y="0" width="10" height="48" fill="url(#iwl)"/>
    <rect x="94" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <rect x="96" y="0" width="10" height="48" fill="url(#igr)"/>
    <!-- Restake -->
    <text x="148" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Restake</text>
    <!-- shared saber green→red -->
    <rect x="190" y="0" width="10" height="48" fill="url(#igl)"/>
    <rect x="200" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <rect x="202" y="0" width="10" height="48" fill="url(#irr)"/>
    <!-- Unstake -->
    <text x="254" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Unstake</text>
    <!-- right saber (red) -->
    <rect x="294" y="0" width="16" height="48" fill="url(#irl)"/><rect x="310" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 5: FOLD ═══ -->
  <rect x="24" y="452" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="476" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">fold: l1 (icon + label) → l2 (icon only)</text>

  <!-- l1: icon + label -->
  <g transform="translate(80, 492)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="76" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">⚡ Cyberlink</text>
    <rect x="130" y="0" width="20" height="48" fill="url(#igl)"/><rect x="150" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>

  <!-- arrow -->
  <text x="300" y="520" font-family="Play, sans-serif" font-size="16" fill="#555" text-anchor="middle">→</text>

  <!-- l2: icon only -->
  <g transform="translate(360, 492)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="28" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">⚡</text>
    <rect x="36" y="0" width="20" height="48" fill="url(#igl)"/><rect x="56" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>

</svg>
