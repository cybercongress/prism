<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="gw" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gy" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fcf000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="iwr"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="iwl" x1="1" x2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="igr"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="igl" x1="1" x2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="irr"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="irl" x1="1" x2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyr"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyl" x1="1" x2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="800" height="600" fill="#000"/>

  <!-- W formula: saber(g/4=2) + glow(3g=24) + pad(2g=16) + text + pad(16) + glow(24) + saber(2) = 84 + text -->
  <!-- gap = 3g = 24 between buttons -->
  <!-- all buttons uniform W=130 per row for visual consistency -->

  <!-- ═══ ROW 1: NEUTRAL ═══ -->
  <!-- 3 × 130 + 2 × 24 = 438. offset = (800-438)/2 = 181 -->
  <text x="400" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">neutral</text>
  <g transform="translate(181, 40)">
    <rect x="2" y="0" width="24" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="65" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Cancel</text>
    <rect x="104" y="0" width="24" height="48" fill="url(#iwl)"/><rect x="128" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>

    <rect x="156" y="0" width="24" height="48" fill="url(#iwr)"/><rect x="154" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="219" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Close</text>
    <rect x="258" y="0" width="24" height="48" fill="url(#iwl)"/><rect x="282" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>

    <rect x="310" y="0" width="24" height="48" fill="url(#iwr)"/><rect x="308" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="373" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Back</text>
    <rect x="412" y="0" width="24" height="48" fill="url(#iwl)"/><rect x="436" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>

  <!-- ═══ ROW 2: CONFIRM ═══ -->
  <!-- 5 × 130 + 4 × 24 = 746. offset = (800-746)/2 = 27 -->
  <rect x="40" y="104" width="720" height="1" fill="#1a1a1a"/>
  <text x="400" y="128" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">confirm</text>
  <g transform="translate(27, 144)">
    <rect x="2" y="0" width="24" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="65" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="104" y="0" width="24" height="48" fill="url(#igl)"/><rect x="128" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>

    <rect x="156" y="0" width="24" height="48" fill="url(#igr)"/><rect x="154" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="219" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Stake</text>
    <rect x="258" y="0" width="24" height="48" fill="url(#igl)"/><rect x="282" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>

    <rect x="310" y="0" width="24" height="48" fill="url(#igr)"/><rect x="308" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="373" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Claim</text>
    <rect x="412" y="0" width="24" height="48" fill="url(#igl)"/><rect x="436" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>

    <rect x="464" y="0" width="24" height="48" fill="url(#igr)"/><rect x="462" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="527" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Send</text>
    <rect x="566" y="0" width="24" height="48" fill="url(#igl)"/><rect x="590" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>

    <rect x="618" y="0" width="24" height="48" fill="url(#igr)"/><rect x="616" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="681" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Delegate</text>
    <rect x="720" y="0" width="24" height="48" fill="url(#igl)"/><rect x="744" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>

  <!-- ═══ ROW 3: DANGER ═══ -->
  <!-- Delete key W=156. Burn W=118. total=156+24+118=298. offset=(800-298)/2=251 -->
  <rect x="40" y="208" width="720" height="1" fill="#1a1a1a"/>
  <text x="400" y="232" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">danger</text>
  <g transform="translate(251, 248)">
    <!-- Delete key W=156 -->
    <rect x="2" y="0" width="24" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="78" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Delete key 🗑</text>
    <rect x="130" y="0" width="24" height="48" fill="url(#irl)"/><rect x="154" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <!-- gap 24 → Burn at 180. W=118 -->
    <rect x="182" y="0" width="24" height="48" fill="url(#irr)"/><rect x="180" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="239" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Burn 🔥</text>
    <rect x="272" y="0" width="24" height="48" fill="url(#irl)"/><rect x="296" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 4: CAUTION ═══ -->
  <!-- 1 × 160. offset = (800-160)/2 = 320 -->
  <rect x="40" y="312" width="720" height="1" fill="#1a1a1a"/>
  <text x="400" y="336" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">caution</text>
  <g transform="translate(320, 352)">
    <rect x="2" y="0" width="24" height="48" fill="url(#iyr)"/><rect x="0" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
    <text x="80" y="30" font-family="Play, sans-serif" font-size="16" fill="#fcf000" text-anchor="middle">Transfer</text>
    <rect x="134" y="0" width="24" height="48" fill="url(#iyl)"/><rect x="158" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
  </g>

  <!-- ═══ ROW 5: STATES ═══ -->
  <!-- disabled W=130, hover W=130, loading W=160. total=130+130+160+2×24=468+48=468+48... -->
  <!-- 130+24+130+24+160 = 468. offset = (800-468)/2 = 166 -->
  <rect x="40" y="416" width="720" height="1" fill="#1a1a1a"/>
  <text x="400" y="440" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states</text>
  <g transform="translate(166, 460)">
    <!-- disabled -->
    <rect x="0" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="65" y="30" font-family="Play, sans-serif" font-size="16" fill="#4b4b4d" text-anchor="middle">Sign</text>
    <rect x="128" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="65" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">disabled</text>

    <!-- hover (gap 24) -->
    <rect x="156" y="0" width="24" height="48" fill="url(#igr)"/><rect x="154" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="219" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="258" y="0" width="24" height="48" fill="url(#igl)"/><rect x="282" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="219" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">hover</text>

    <!-- loading (gap 24) -->
    <rect x="310" y="0" width="24" height="48" fill="url(#igr)"/><rect x="308" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="388" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" opacity="0.5" text-anchor="middle">Signing...</text>
    <rect x="442" y="0" width="24" height="48" fill="url(#igl)"/><rect x="466" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="388" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>
  </g>

</svg>
