<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520">
  <defs>
    <filter id="gw" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gy" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fcf000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="iwr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="iwl" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="igr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="igl" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="irr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="irl" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyl" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="560" height="520" fill="#000"/>

  <!-- ═══ ROW 1: EMOTION VARIANTS ═══ -->
  <text x="280" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">emotion variants</text>

  <!-- neutral — centered at x=70 -->
  <g transform="translate(10, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Navigate</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#iwl)"/>
    <rect x="118" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <text x="70" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">neutral</text>

  <!-- confirm — centered at x=210 -->
  <g transform="translate(150, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Confirm</text>
    <rect x="92" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="112" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="210" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">confirm</text>

  <!-- danger — centered at x=350 -->
  <g transform="translate(296, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="50" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Delete</text>
    <rect x="80" y="0" width="20" height="48" fill="url(#irl)"/>
    <rect x="100" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>
  <text x="350" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">danger</text>

  <!-- caution — centered at x=480 -->
  <g transform="translate(424, 44)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iyr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
    <text x="52" y="30" font-family="Play, sans-serif" font-size="16" fill="#fcf000" text-anchor="middle">Transfer</text>
    <rect x="86" y="0" width="20" height="48" fill="url(#iyl)"/>
    <rect x="106" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
  </g>
  <text x="480" y="108" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">caution</text>

  <!-- ═══ ROW 2: STATES ═══ -->
  <rect x="24" y="124" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="148" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states</text>

  <!-- disabled -->
  <g transform="translate(60, 164)">
    <rect x="0" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="52" y="30" font-family="Play, sans-serif" font-size="16" fill="#4b4b4d" text-anchor="middle">Disabled</text>
    <rect x="102" y="0" width="2" height="48" fill="#4b4b4d"/>
  </g>
  <text x="114" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">disabled</text>

  <!-- hover (wider glow 4g) -->
  <g transform="translate(220, 164)">
    <rect x="2" y="0" width="28" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Hover</text>
    <rect x="86" y="0" width="28" height="48" fill="url(#igl)"/>
    <rect x="112" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="278" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">hover (glow 4g)</text>

  <!-- loading (breathing) -->
  <g transform="translate(380, 164)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.6"/>
    <text x="56" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" opacity="0.6" text-anchor="middle">Signing...</text>
    <rect x="90" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.6"/>
  </g>
  <text x="440" y="228" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading (breathe)</text>

  <!-- ═══ ROW 3: DOUBLE ═══ -->
  <rect x="24" y="244" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="268" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">double (destructive never leftmost)</text>

  <g transform="translate(140, 284)">
    <!-- Stake (confirm) -->
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="50" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Stake</text>
    <rect x="80" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="100" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <!-- Unstake (danger) -->
    <rect x="118" y="0" width="20" height="48" fill="url(#irr)"/>
    <rect x="116" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="166" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Unstake</text>
    <rect x="198" y="0" width="20" height="48" fill="url(#irl)"/>
    <rect x="218" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 4: TRIPLE ═══ -->
  <rect x="24" y="348" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="372" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">triple (primary center, destructive rightmost)</text>

  <g transform="translate(80, 388)">
    <!-- Cancel (neutral) -->
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="46" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Cancel</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#iwl)"/>
    <rect x="94" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <!-- Restake (confirm) -->
    <rect x="112" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="110" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="160" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Restake</text>
    <rect x="192" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="212" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <!-- Unstake (danger) -->
    <rect x="228" y="0" width="20" height="48" fill="url(#irr)"/>
    <rect x="226" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="276" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">Unstake</text>
    <rect x="308" y="0" width="20" height="48" fill="url(#irl)"/>
    <rect x="328" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 5: FOLD ═══ -->
  <rect x="24" y="452" width="512" height="1" fill="#1a1a1a"/>
  <text x="280" y="476" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">fold: l1 (icon + label) → l2 (icon only)</text>

  <!-- l1 -->
  <g transform="translate(100, 490)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="76" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">⚡ Cyberlink</text>
    <rect x="132" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="152" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="180" y="510" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="end">l1</text>

  <!-- arrow -->
  <text x="310" y="518" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">→</text>

  <!-- l2 -->
  <g transform="translate(360, 490)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/>
    <rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="28" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">⚡</text>
    <rect x="38" y="0" width="20" height="48" fill="url(#igl)"/>
    <rect x="58" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <text x="424" y="510" font-family="Play, sans-serif" font-size="10" fill="#555">l2</text>

</svg>
