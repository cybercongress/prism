<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560">
  <defs>
    <filter id="gw" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#00fe00" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff0000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gy" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fcf000" flood-opacity="0.5" result="c"/><feComposite in="c" in2="b" operator="in" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="iwr"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="iwl" x1="1" x2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="igr"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="igl" x1="1" x2="0"><stop offset="0%" stop-color="#00fe00" stop-opacity="0.12"/><stop offset="100%" stop-color="#00fe00" stop-opacity="0"/></linearGradient>
    <linearGradient id="irr"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="irl" x1="1" x2="0"><stop offset="0%" stop-color="#ff0000" stop-opacity="0.12"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyr"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
    <linearGradient id="iyl" x1="1" x2="0"><stop offset="0%" stop-color="#fcf000" stop-opacity="0.12"/><stop offset="100%" stop-color="#fcf000" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="600" height="560" fill="#000"/>

  <!-- ═══ BUTTON TEMPLATE: fixed width per row ═══ -->
  <!-- W = button width, H = 48 (6g) -->
  <!-- saber at x=0, glow rect x=2 w=20 -->
  <!-- text at x=W/2 (centered) -->
  <!-- right glow at x=W-22, right saber at x=W-2 -->

  <!-- ═══ ROW 1: NEUTRAL — W=96, gap=24, 3 buttons ═══ -->
  <!-- total = 3×96 + 2×24 = 336, offset = (600-336)/2 = 132 -->
  <text x="300" y="24" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">neutral</text>

  <g transform="translate(132, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Cancel</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="94" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <g transform="translate(252, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Close</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="94" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>
  <g transform="translate(372, 40)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iwr)"/><rect x="0" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Back</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#iwl)"/><rect x="94" y="0" width="2" height="48" fill="#fff" filter="url(#gw)"/>
  </g>

  <!-- ═══ ROW 2: CONFIRM — W=96, gap=16, 5 buttons ═══ -->
  <!-- total = 5×96 + 4×16 = 544, offset = (600-544)/2 = 28 -->
  <rect x="40" y="104" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="128" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">confirm</text>

  <g transform="translate(28, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(140, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Stake</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(252, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Claim</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(364, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Send</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>
  <g transform="translate(476, 144)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Delegate</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
  </g>

  <!-- ═══ ROW 3: DANGER — W=120, gap=32, 2 buttons ═══ -->
  <!-- total = 2×120 + 1×32 = 272, offset = (600-272)/2 = 164 -->
  <rect x="40" y="208" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="232" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">danger</text>

  <g transform="translate(164, 248)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">🗑 Delete key</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#irl)"/><rect x="118" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>
  <g transform="translate(316, 248)">
    <rect x="2" y="0" width="20" height="48" fill="url(#irr)"/><rect x="0" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#ff0000" text-anchor="middle">🔥 Burn</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#irl)"/><rect x="118" y="0" width="2" height="48" fill="#ff0000" filter="url(#gr)"/>
  </g>

  <!-- ═══ ROW 4: CAUTION — W=120, 1 button ═══ -->
  <!-- offset = (600-120)/2 = 240 -->
  <rect x="40" y="312" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="336" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">caution</text>

  <g transform="translate(240, 352)">
    <rect x="2" y="0" width="20" height="48" fill="url(#iyr)"/><rect x="0" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
    <text x="60" y="30" font-family="Play, sans-serif" font-size="16" fill="#fcf000" text-anchor="middle">Transfer</text>
    <rect x="98" y="0" width="20" height="48" fill="url(#iyl)"/><rect x="118" y="0" width="2" height="48" fill="#fcf000" filter="url(#gy)"/>
  </g>

  <!-- ═══ ROW 5: STATES — W=96, gap=48, 3 buttons ═══ -->
  <!-- total = 3×96 + 2×48 = 384, offset = (600-384)/2 = 108 -->
  <rect x="40" y="416" width="520" height="1" fill="#1a1a1a"/>
  <text x="300" y="440" font-family="Play, sans-serif" font-size="14" fill="#555" text-anchor="middle">states</text>

  <!-- disabled -->
  <g transform="translate(108, 456)">
    <rect x="0" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#4b4b4d" text-anchor="middle">Sign</text>
    <rect x="94" y="0" width="2" height="48" fill="#4b4b4d"/>
    <text x="48" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">disabled</text>
  </g>

  <!-- hover: same W=96 but glow extends 4px wider each side -->
  <g transform="translate(252, 456)">
    <rect x="-2" y="0" width="24" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" text-anchor="middle">Sign</text>
    <rect x="74" y="0" width="24" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)"/>
    <text x="48" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">hover</text>
  </g>

  <!-- loading -->
  <g transform="translate(396, 456)">
    <rect x="2" y="0" width="20" height="48" fill="url(#igr)"/><rect x="0" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="48" y="30" font-family="Play, sans-serif" font-size="16" fill="#00fe00" opacity="0.5" text-anchor="middle">Sign</text>
    <rect x="74" y="0" width="20" height="48" fill="url(#igl)"/><rect x="94" y="0" width="2" height="48" fill="#00fe00" filter="url(#gg)" opacity="0.5"/>
    <text x="48" y="68" font-family="Play, sans-serif" font-size="10" fill="#555" text-anchor="middle">loading</text>
  </g>

</svg>
