<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- ion atom: fixed square sizes from 2g to 12g, emotion colors -->
  <!-- g=8 -->
  <rect width="480" height="320" fill="#000000"/>

  <text x="240" y="24" font-family="Play, sans-serif" font-size="14" fill="#555555" text-anchor="middle">ion sizes (g = 8)</text>

  <!-- 2g = 16px -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="4" y1="4" x2="12" y2="12" stroke="#ffffff" stroke-width="1"/>
    <line x1="12" y1="4" x2="4" y2="12" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="32" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">2g</text>
  </g>

  <!-- 5g/2 = 20px -->
  <g transform="translate(72, 46)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="10" cy="10" r="4" fill="#ffffff"/>
    <text x="10" y="36" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">5g/2</text>
  </g>

  <!-- 4g = 32px -->
  <g transform="translate(128, 40)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#ffffff" stroke-width="1"/>
    <polygon points="16,6 26,26 6,26" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">4g</text>
  </g>

  <!-- 6g = 48px -->
  <g transform="translate(192, 32)">
    <rect x="0" y="0" width="48" height="48" rx="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="24" cy="24" r="4" fill="#ffffff"/>
    <text x="24" y="64" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">6g</text>
  </g>

  <!-- 12g = 96px -->
  <g transform="translate(272, 8)">
    <rect x="0" y="0" width="96" height="96" rx="6" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="48" cy="48" r="30" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="48" cy="48" r="8" fill="#ffffff"/>
    <text x="48" y="118" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">12g (hero)</text>
  </g>

  <!-- separator -->
  <rect x="24" y="136" width="432" height="1" fill="#222222"/>

  <!-- emotion colors on 4g icons -->
  <text x="240" y="160" font-family="Play, sans-serif" font-size="14" fill="#555555" text-anchor="middle">ion emotion colors (4g)</text>

  <!-- neutral -->
  <g transform="translate(24, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#ffffff" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#ffffff"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">neutral</text>
  </g>

  <!-- joy -->
  <g transform="translate(88, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#00fe00" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#00fe00" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#00fe00"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">joy</text>
  </g>

  <!-- anger -->
  <g transform="translate(152, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#ff0000" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#ff0000" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#ff0000"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">anger</text>
  </g>

  <!-- interest -->
  <g transform="translate(216, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#00acff" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#00acff" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#00acff"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#00acff" text-anchor="middle">interest</text>
  </g>

  <!-- surprise -->
  <g transform="translate(288, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#fcf000" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#fcf000" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#fcf000"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#fcf000" text-anchor="middle">surprise</text>
  </g>

  <!-- fear -->
  <g transform="translate(360, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#d500f9" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#d500f9"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#d500f9" text-anchor="middle">fear</text>
  </g>

  <!-- disgust -->
  <g transform="translate(424, 176)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#ff5b00" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#ff5b00" opacity="0.2"/>
    <circle cx="16" cy="16" r="4" fill="#ff5b00"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#ff5b00" text-anchor="middle">disgust</text>
  </g>

  <!-- separator -->
  <rect x="24" y="244" width="432" height="1" fill="#222222"/>

  <!-- states -->
  <text x="240" y="268" font-family="Play, sans-serif" font-size="14" fill="#555555" text-anchor="middle">ion states</text>

  <!-- default -->
  <g transform="translate(64, 284)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#ffffff"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">default</text>
  </g>

  <!-- hover: scale 1.1 -->
  <g transform="translate(168, 282)">
    <rect x="-2" y="-2" width="36" height="36" rx="3" fill="none" stroke="#00fe00" stroke-width="1"/>
    <circle cx="16" cy="16" r="7" fill="#00fe00"/>
    <text x="16" y="50" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">hover</text>
  </g>

  <!-- active: scale 0.95 -->
  <g transform="translate(276, 285)">
    <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="#00fe00" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#00fe00"/>
    <text x="16" y="49" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">active</text>
  </g>

  <!-- disabled -->
  <g transform="translate(376, 284)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="none" stroke="#4b4b4d" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#4b4b4d"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#4b4b4d" text-anchor="middle">disabled</text>
  </g>
</svg>
