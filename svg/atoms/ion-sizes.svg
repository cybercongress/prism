<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- ion atom: fixed square sizes from 2g to 12g -->
  <!-- g=8, shown as filled circles (icon placeholder) -->
  <rect width="400" height="280" fill="#000000"/>

  <text x="200" y="24" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">ion sizes (g=8)</text>

  <!-- 2g = 16px -->
  <g transform="translate(32, 48)">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="5" y1="5" x2="11" y2="11" stroke="#ffffff" stroke-width="1"/>
    <line x1="11" y1="5" x2="5" y2="11" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="32" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">2g</text>
    <text x="8" y="44" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">16px</text>
  </g>

  <!-- 5g/2 = 20px -->
  <g transform="translate(88, 48)">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#ffffff"/>
    <text x="10" y="36" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">5g/2</text>
    <text x="10" y="48" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">20px</text>
  </g>

  <!-- 4g = 32px -->
  <g transform="translate(148, 40)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    <polygon points="16,6 26,26 6,26" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="16" y="52" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">4g</text>
    <text x="16" y="64" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">32px</text>
  </g>

  <!-- 6g = 48px -->
  <g transform="translate(216, 32)">
    <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="24" cy="24" r="4" fill="#ffffff"/>
    <text x="24" y="68" font-family="Play, sans-serif" font-size="10" fill="#777777" text-anchor="middle">6g · 48px</text>
  </g>

  <!-- 12g = 96px -->
  <g transform="translate(296, 0)">
    <rect x="0" y="0" width="96" height="96" rx="8" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="48" cy="48" r="30" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="48" y="44" font-family="Play, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">12g</text>
    <text x="48" y="64" font-family="Play, sans-serif" font-size="12" fill="#777777" text-anchor="middle">96px · hero</text>
  </g>

  <!-- emotion colors on 4g icon -->
  <text x="200" y="136" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">ion emotion colors (4g)</text>

  <!-- white (default) -->
  <g transform="translate(32, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#ffffff" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">neutral</text>
  </g>

  <!-- green -->
  <g transform="translate(96, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#00fe00" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#00fe00" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#00fe00" text-anchor="middle">joy</text>
  </g>

  <!-- red -->
  <g transform="translate(160, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#ff0000" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#ff0000" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#ff0000" text-anchor="middle">anger</text>
  </g>

  <!-- blue -->
  <g transform="translate(224, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#00acff" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#00acff" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#00acff" text-anchor="middle">interest</text>
  </g>

  <!-- yellow -->
  <g transform="translate(288, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#fcf000" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#fcf000" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#fcf000" text-anchor="middle">surprise</text>
  </g>

  <!-- violet -->
  <g transform="translate(352, 152)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#d500f9" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#d500f9" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#d500f9" text-anchor="middle">fear</text>
  </g>

  <!-- disabled state -->
  <g transform="translate(32, 220)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="none" stroke="#4b4b4d" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#4b4b4d" opacity="0.3"/>
    <text x="16" y="48" font-family="Play, sans-serif" font-size="10" fill="#4b4b4d" text-anchor="middle">disabled</text>
  </g>
</svg>
