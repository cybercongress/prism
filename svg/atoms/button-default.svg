<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96">
  <!-- 0-atoms/button/default -->
  <defs>
    <filter id="glow" x="-300%" y="-50%" width="700%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- left saber: white line, green glow -->
  <rect x="32" y="8" width="2" height="80" fill="#00fe00" filter="url(#glow)" opacity="0.6"/>
  <rect x="32" y="8" width="2" height="80" fill="#ffffff"/>
  <!-- right saber: white line, green glow -->
  <rect x="286" y="8" width="2" height="80" fill="#00fe00" filter="url(#glow)" opacity="0.6"/>
  <rect x="286" y="8" width="2" height="80" fill="#ffffff"/>
  <!-- label -->
  <text x="160" y="54" font-family="monospace" font-size="16" fill="#00fe00" text-anchor="middle">text C</text>
</svg>
