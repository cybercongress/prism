<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96">
  <!-- 0-atoms/button/default — saber glow + text + saber glow -->
  <!-- prysm atom, acid palette -->
  <defs>
    <filter id="glow-green" x="-300%" y="-50%" width="700%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-300%" y="-50%" width="700%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="96" fill="#000000"/>
  <!-- left saber with glow -->
  <rect x="32" y="8" width="2" height="80" fill="#00acff" filter="url(#glow-blue)"/>
  <!-- right saber with glow -->
  <rect x="286" y="8" width="2" height="80" fill="#00fe00" filter="url(#glow-green)"/>
  <!-- label -->
  <text x="160" y="54" font-family="monospace" font-size="16" fill="#00fe00" text-anchor="middle">text C</text>
</svg>
