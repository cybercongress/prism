<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- glass atom: dark translucent surfaces with emotion tints -->
  <!-- g=8, background #000000, glass = dark surface with subtle edge -->
  <rect width="480" height="360" fill="#000000"/>

  <text x="240" y="24" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">glass depth levels</text>

  <!-- depth levels: glass is a dark surface, lighter = more opaque/closer -->
  <!-- using rgba edge strokes to show boundary -->

  <!-- foreground: closest, most visible -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="96" height="56" rx="4" ry="4" fill="#1a1a1a" stroke="#555555" stroke-width="0.5"/>
    <text x="48" y="76" font-family="Play, sans-serif" font-size="12" fill="#d7d7d7" text-anchor="middle">foreground</text>
    <text x="48" y="90" font-family="Play, sans-serif" font-size="10" fill="#555555" text-anchor="middle">z 40-50</text>
  </g>

  <!-- midground: standard cards/panels -->
  <g transform="translate(140, 48)">
    <rect x="0" y="0" width="96" height="56" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <text x="48" y="76" font-family="Play, sans-serif" font-size="12" fill="#d7d7d7" text-anchor="middle">midground</text>
    <text x="48" y="90" font-family="Play, sans-serif" font-size="10" fill="#555555" text-anchor="middle">z 10-20</text>
  </g>

  <!-- background: space-level -->
  <g transform="translate(256, 48)">
    <rect x="0" y="0" width="96" height="56" rx="4" ry="4" fill="#090909" stroke="#222222" stroke-width="0.5"/>
    <text x="48" y="76" font-family="Play, sans-serif" font-size="12" fill="#d7d7d7" text-anchor="middle">background</text>
    <text x="48" y="90" font-family="Play, sans-serif" font-size="10" fill="#555555" text-anchor="middle">z 0</text>
  </g>

  <!-- subtle: barely visible -->
  <g transform="translate(372, 48)">
    <rect x="0" y="0" width="96" height="56" rx="4" ry="4" fill="#050505" stroke="#151515" stroke-width="0.5"/>
    <text x="48" y="76" font-family="Play, sans-serif" font-size="12" fill="#d7d7d7" text-anchor="middle">subtle</text>
    <text x="48" y="90" font-family="Play, sans-serif" font-size="10" fill="#555555" text-anchor="middle">z 0</text>
  </g>

  <!-- emotion tints: colored glass on dark surface -->
  <text x="240" y="128" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">emotion tint on midground glass</text>

  <!-- joy: green tint -->
  <g transform="translate(16, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#00fe00" opacity="0.12"/>
    <text x="40" y="68" font-family="Play, sans-serif" font-size="11" fill="#00fe00" text-anchor="middle">joy</text>
  </g>

  <!-- anger: red tint -->
  <g transform="translate(112, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#ff0000" opacity="0.12"/>
    <text x="40" y="68" font-family="Play, sans-serif" font-size="11" fill="#ff0000" text-anchor="middle">anger</text>
  </g>

  <!-- surprise: yellow tint -->
  <g transform="translate(208, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#fcf000" opacity="0.12"/>
    <text x="40" y="68" font-family="Play, sans-serif" font-size="11" fill="#fcf000" text-anchor="middle">surprise</text>
  </g>

  <!-- interest: blue tint -->
  <g transform="translate(304, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="48" rx="4" ry="4" fill="#00acff" opacity="0.12"/>
    <text x="40" y="68" font-family="Play, sans-serif" font-size="11" fill="#00acff" text-anchor="middle">interest</text>
  </g>

  <!-- fear: violet tint -->
  <g transform="translate(400, 148)">
    <rect x="0" y="0" width="64" height="48" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="0" width="64" height="48" rx="4" ry="4" fill="#d500f9" opacity="0.12"/>
    <text x="32" y="68" font-family="Play, sans-serif" font-size="11" fill="#d500f9" text-anchor="middle">fear</text>
  </g>

  <!-- nesting example -->
  <text x="240" y="248" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">nesting (max 3 deep)</text>

  <g transform="translate(120, 264)">
    <!-- outer: background depth -->
    <rect x="0" y="0" width="240" height="80" rx="4" ry="4" fill="#090909" stroke="#222222" stroke-width="0.5"/>
    <!-- middle: midground depth -->
    <rect x="8" y="8" width="224" height="64" rx="4" ry="4" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <!-- inner: foreground depth -->
    <rect x="16" y="16" width="208" height="48" rx="4" ry="4" fill="#1a1a1a" stroke="#555555" stroke-width="0.5"/>
    <text x="120" y="44" font-family="Play, sans-serif" font-size="14" fill="#d7d7d7" text-anchor="middle">background / midground / foreground</text>
  </g>
</svg>
