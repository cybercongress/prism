<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 16" width="144" height="16">
  <!-- 0-atoms/address/small — truncated address with mini hash bars -->
  <!-- prysm atom, acid palette -->
  <g id="address-small">
    <!-- mini hash bars (6 bars, 2 rows) -->
    <g id="hash-bars" transform="translate(0,0)">
      <rect x="0" y="0" width="3" height="6" fill="#00fe00"/>
      <rect x="4" y="0" width="3" height="6" fill="#d500f9"/>
      <rect x="8" y="0" width="3" height="6" fill="#00acff"/>
      <rect x="12" y="0" width="3" height="6" fill="#00acff"/>
      <rect x="16" y="0" width="3" height="6" fill="#00fe00"/>
      <rect x="20" y="0" width="3" height="6" fill="#fcf000"/>
      <rect x="0" y="6" width="3" height="6" fill="#00fe00"/>
      <rect x="4" y="6" width="3" height="6" fill="#d500f9"/>
      <rect x="8" y="6" width="3" height="6" fill="#00acff"/>
      <rect x="12" y="6" width="3" height="6" fill="#00acff"/>
      <rect x="16" y="6" width="3" height="6" fill="#00fe00"/>
      <rect x="20" y="6" width="3" height="6" fill="#fcf000"/>
    </g>
    <!-- truncated address -->
    <text id="address-text" x="30" y="12" font-family="monospace" font-size="12" fill="#ffffff">bos1qx...8kp</text>
  </g>
</svg>
