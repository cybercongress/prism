<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- text atom: size scale h1 through micro, Play font -->
  <!-- g=8, all sizes in quanta -->
  <rect width="400" height="320" fill="#000000"/>

  <text x="200" y="24" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">text size scale (g=8)</text>

  <!-- h1: 4g = 32px -->
  <g transform="translate(24, 48)">
    <text x="0" y="32" font-family="Play, sans-serif" font-size="32" fill="#ffffff">h1 — 4g</text>
    <text x="300" y="32" font-family="Play, sans-serif" font-size="10" fill="#777777">32px · page titles</text>
  </g>

  <!-- h2: 3g = 24px -->
  <g transform="translate(24, 96)">
    <text x="0" y="24" font-family="Play, sans-serif" font-size="24" fill="#ffffff">h2 — 3g</text>
    <text x="300" y="24" font-family="Play, sans-serif" font-size="10" fill="#777777">24px · sections</text>
  </g>

  <!-- h3: 5g/2 = 20px -->
  <g transform="translate(24, 136)">
    <text x="0" y="20" font-family="Play, sans-serif" font-size="20" fill="#ffffff">h3 — 5g/2</text>
    <text x="300" y="20" font-family="Play, sans-serif" font-size="10" fill="#777777">20px · subsections</text>
  </g>

  <!-- body: 2g = 16px -->
  <g transform="translate(24, 172)">
    <text x="0" y="16" font-family="Play, sans-serif" font-size="16" fill="#ffffff">body — 2g</text>
    <text x="300" y="16" font-family="Play, sans-serif" font-size="10" fill="#777777">16px · content</text>
  </g>

  <!-- caption: 7g/4 = 14px -->
  <g transform="translate(24, 204)">
    <text x="0" y="14" font-family="Play, sans-serif" font-size="14" fill="#d7d7d7">caption — 7g/4</text>
    <text x="300" y="14" font-family="Play, sans-serif" font-size="10" fill="#777777">14px · labels</text>
  </g>

  <!-- micro: 3g/2 = 12px -->
  <g transform="translate(24, 232)">
    <text x="0" y="12" font-family="Play, sans-serif" font-size="12" fill="#777777">micro — 3g/2</text>
    <text x="300" y="12" font-family="Play, sans-serif" font-size="10" fill="#777777">12px · timestamps</text>
  </g>

  <!-- color levels -->
  <text x="200" y="268" font-family="Play, sans-serif" font-size="16" fill="#777777" text-anchor="middle">text color levels</text>

  <g transform="translate(24, 280)">
    <text x="0" y="16" font-family="Play, sans-serif" font-size="16" fill="#ffffff">primary #ffffff</text>
    <text x="160" y="16" font-family="Play, sans-serif" font-size="16" fill="#d7d7d7">secondary #d7d7d7</text>
    <text x="330" y="16" font-family="Play, sans-serif" font-size="16" fill="#777777">dim</text>
  </g>

  <g transform="translate(24, 304)">
    <text x="0" y="12" font-family="Play, sans-serif" font-size="14" fill="#4b4b4d">muted #4b4b4d</text>
    <text x="160" y="12" font-family="Play, sans-serif" font-size="14" fill="#00fe00">emotion (joy)</text>
    <text x="310" y="12" font-family="Play, sans-serif" font-size="14" fill="#ff0000">emotion (anger)</text>
  </g>
</svg>
